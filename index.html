<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matematika Kelas 3 — Menghitung Kerajinan Purun Kita</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png" />
    <style>
      #nl-badge-frame,
      iframe#nl-badge-frame,
      iframe[title*="Netlify"],
      iframe[title*="Powered by Netlify"],
      #netlify-badge,
      .netlify-badge,
      [data-netlify-badge],
      iframe#netlify-drawer,
      netlify-drawer,
      vercel-live-feedback,
      #vercel-live-feedback,
      .__vercel-toolbar,
      [data-vercel-toolbar] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        left: -9999px !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      (function () {
        try {
          localStorage.setItem('nl-hud:public:v1', 'hidden');
          localStorage.setItem('nl-hud:owner-private:v1', 'hidden');
        } catch (e) {}

        // Cegah pembuatan iframe Netlify / Vercel widget
        const origCreate = document.createElement.bind(document);
        document.createElement = function (tag, opts) {
          const el = origCreate(tag, opts);
          if (tag && tag.toLowerCase() === 'iframe') {
            const origSet = el.setAttribute.bind(el);
            el.setAttribute = function (name, val) {
              if (
                (name === 'id' && (val === 'nl-badge-frame' || val === 'nl-hud-frame')) ||
                (name === 'title' && val && val.indexOf('Netlify') !== -1)
              ) {
                el.style.cssText =
                  'display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;position:absolute!important;left:-9999px!important;width:0!important;height:0!important;';
              }
              return origSet(name, val);
            };
          }
          return el;
        };

        function cleanWidgets() {
          const els = document.querySelectorAll(
            'iframe#nl-badge-frame, iframe#nl-hud-frame, iframe[title*="Netlify"], vercel-live-feedback, #vercel-live-feedback, .__vercel-toolbar, script[src*="netlify/scripts/hud"]'
          );
          els.forEach(function (el) {
            el.remove();
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', cleanWidgets);
        } else {
          cleanWidgets();
        }

        const observer = new MutationObserver(cleanWidgets);
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </head>
  <body>
    <!-- Trap agar script Netlify otomatis batal jalan (early return) -->
    <div id="nl-badge-frame" style="display:none!important;visibility:hidden!important;position:absolute!important;left:-9999px!important;width:0!important;height:0!important;pointer-events:none!important;opacity:0!important;"></div>
    <div id="nl-hud-frame" style="display:none!important;visibility:hidden!important;position:absolute!important;left:-9999px!important;width:0!important;height:0!important;pointer-events:none!important;opacity:0!important;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
