<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matematika Kelas 3 — Menghitung Kerajinan Purun Kita</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png" />
    <style>
      #nl-badge-frame,
      iframe#nl-badge-frame,
      iframe[title*="Netlify"],
      iframe[title*="Powered by Netlify"],
      #netlify-badge,
      .netlify-badge,
      [data-netlify-badge],
      iframe#netlify-drawer,
      netlify-drawer,
      vercel-live-feedback,
      #vercel-live-feedback,
      .__vercel-toolbar,
      [data-vercel-toolbar] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        left: -9999px !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      (function () {
        try {
          localStorage.setItem(
            'nl-hud:public:v1',
            JSON.stringify({ hidden: true, dismissed: true, minimized: true })
          );
        } catch (e) {}

        function purgeBadge() {
          const els = document.querySelectorAll(
            '#nl-badge-frame, iframe#nl-badge-frame, iframe[title*="Netlify"], iframe#netlify-drawer, netlify-drawer, [data-netlify-badge], vercel-live-feedback, #vercel-live-feedback, .__vercel-toolbar'
          );
          els.forEach(function (el) {
            el.remove();
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', purgeBadge);
        } else {
          purgeBadge();
        }

        const observer = new MutationObserver(function () {
          purgeBadge();
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
